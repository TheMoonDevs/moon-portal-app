name: Mobile app checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      # Expo ships patch releases of its packages every few days, so the
      # "packages match the SDK" check would fail every pull request until
      # someone bumps them. Bumping changes native code, which belongs in a
      # store release (see mobile-update.yml), so it is reported below as a
      # warning instead of failing the check. The doctor version is pinned so
      # a new doctor release can't start failing pull requests on its own.
      - name: Expo doctor
        run: npx --yes expo-doctor@1.21.8
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
      - name: Expo packages behind the SDK (warning only)
        run: |
          if ! npx expo install --check > expo-check.txt 2>&1; then
            cat expo-check.txt
            echo "::warning title=Expo packages behind the SDK::Run 'npx expo install --fix' in mobile/ with the next store release."
          fi
